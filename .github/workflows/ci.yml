name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rocket_software/requirements.txt

      - name: Install dependencies
        run: pip install -r rocket_software/requirements.txt

      # tests/ is a package, rocket_software/ is not — pytest prepends
      # rocket_software to sys.path, so `import simulation.*` resolves.
      - name: Run tests
        run: pytest rocket_software/tests -v
